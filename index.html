<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff4b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Laint's Poem">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<meta property="og:image" content="assets/icons/icon-512.png">
<title>Laint's Poem</title>
<meta name="description" content="Sổ thơ của Laint, viết bằng Poenote.">
<meta property="og:title" content="Laint's Poem">
<meta property="og:description" content="Sổ thơ của Laint, viết bằng Poenote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/poenote.css">
<style>
.mast { padding-block: 22px 8px; }
.mast h1 { font-family: var(--f-poem); font-weight: 800; font-size: clamp(40px, 13vw, 58px); line-height: .95; letter-spacing: -0.03em; margin: 0; }
.mast p { margin: 8px 0 0; color: var(--muted); }
.strip { margin-top: 14px; background: var(--beige); color: var(--ink); border-radius: 12px; padding: 9px 14px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 10px; }
.shelf { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 18px max(16px, calc(50% - 150px)) 22px; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.sec { padding-block: 6px 110px; }
.sec h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid a { text-decoration: none; color: inherit; display: block; min-width: 0; }
.grid .nb { border-radius: 16px; }
.grid .nb-top { height: 30px; padding: 0 10px; } .grid .nb-top .w { font-size: 14px; } .grid .rings { gap: 5px; } .grid .rings i { width: 6px; height: 6px; }
.grid .nb-label { font-size: 10px; padding: 6px 10px; }
.grid .nb-blk { padding: 8px 10px 10px; min-height: 70px; } .grid .nb-blk h3 { font-size: 14px; margin: 3px 0 0; } .grid .nb-blk .k { font-size: 10px; }
.grid .music-chip { left: 6px; bottom: 6px; font-size: 10.5px; padding: 3px 8px; }
.empty { text-align: center; padding: 30px 10px; }
.empty .phone { margin: 0 auto 16px; width: 70%; }
/* đọc một bài */
.reader { position: fixed; inset: 0; z-index: 35; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.reader .col { padding-block: 16px 60px; }
.reader .tools { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.reader .tools .sp { margin-left: auto; }
.reader .nb-blk p { -webkit-line-clamp: unset; display: none; }
.poem { font-family: var(--f-poem); font-size: 21px; line-height: 1.75; white-space: pre-wrap; margin: 20px 0 8px; overflow-wrap: anywhere; }
.poem .stz { display: block; height: .8em; }
.meta { font-size: 13px; color: var(--muted); border-top: 1.5px solid var(--line); padding-top: 10px; margin-top: 18px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.player { margin-top: 18px; }
.foot { text-align: center; font-size: 12.5px; color: var(--muted); padding: 10px 0 30px; }
</style>
</head>
<body>
<header class="bar"><div class="col">
  <a class="mark" href="./" id="mark">Laint's Poem</a>
  <button class="ibtn" type="button" id="shareLib"></button>
  <a class="ibtn" href="write.html" id="writeLink" hidden></a>
</div></header>

<main>
  <section class="col mast">
    <h1 id="libTitle">Laint's Poem</h1>
    <p>Những trang thơ viết tay bằng Poenote.</p>
    <div class="strip"><span id="count">Đang mở sổ…</span><span id="latest"></span></div>
  </section>
  <div class="shelf" id="shelf" aria-label="Bài mới nhất"></div>
  <section class="col sec">
    <h2 id="allTitle"></h2>
    <div class="grid" id="grid"></div>
    <div id="emptyBox"></div>
  </section>
  <p class="foot">Viết bằng <b>Poenote</b></p>
</main>

<section class="reader" id="reader" hidden></section>
<a class="fab" href="write.html" id="fab" hidden aria-label="Viết bài mới"></a>

<script src="assets/engine.js"></script>
<script src="assets/common.js"></script>
<script>
(function () {
  'use strict';
  var P = window.Poenote, $ = P.$, esc = P.esc, cfg = P.cfg(), owner = P.isOwner(), lib = null;
  $('#shareLib').innerHTML = P.ICONS.share + '<span>Chia sẻ</span>';
  $('#mark').textContent = cfg.libraryName; $('#libTitle').textContent = cfg.libraryName; document.title = cfg.libraryName;
  if (owner) {
    $('#writeLink').hidden = false; $('#writeLink').innerHTML = P.ICONS.pen + '<span>Poenote</span>';
    $('#fab').hidden = false; $('#fab').innerHTML = P.ICONS.plus;
  }
  $('#shareLib').addEventListener('click', function () { P.copy(P.siteUrl()); });

  function render() {
    var ps = lib.poems;
    $('#count').textContent = ps.length + ' bài thơ';
    $('#latest').textContent = ps[0] ? 'Mới nhất ' + P.fmtDate(ps[0].createdAt) : '';
    $('#allTitle').textContent = ps.length > 3 ? 'Tất cả các trang' : '';
    $('#shelf').innerHTML = ps.slice(0, 6).map(function (p) { return '<a class="phone" href="#poem-' + esc(p.id) + '">' + P.notebook(p) + '</a>'; }).join('');
    $('#shelf').hidden = !ps.length;
    $('#grid').innerHTML = ps.length > 3 ? ps.map(function (p) { return '<a href="#poem-' + esc(p.id) + '">' + P.notebook(p, { compact: true }) + '</a>'; }).join('') : '';
    $('#emptyBox').innerHTML = ps.length ? '' :
      '<div class="empty"><div class="phone">' + P.notebook({ title: 'Trang đầu tiên', text: 'Cuốn sổ đang chờ bài thơ đầu tiên.', color: 'mint', createdAt: new Date().toISOString() }) + '</div>' +
      (owner ? '<p>Sổ còn trống. Mở <b>Poenote</b>, viết một bài rồi bấm <b>+</b> để đặt vào đây.</p><a class="btn pri" href="write.html">Viết bài đầu tiên</a>' : '<p class="muted">Sổ thơ chưa có bài nào. Quay lại sau nhé.</p>') + '</div>';
    route();
  }

  function route() {
    var m = location.hash.match(/^#poem-(.+)$/), r = $('#reader');
    if (!m || !lib) { r.hidden = true; r.innerHTML = ''; document.body.style.overflow = ''; return; }
    var p = lib.poems.filter(function (q) { return q.id === m[1]; })[0];
    if (!p) { r.hidden = true; P.toast('Bài thơ này không còn trong sổ.'); return; }
    var stanzas = String(p.text).replace(/\r/g, '').split(/\n\s*\n/).map(function (s) { return esc(s.trim()); }).join('<span class="stz"></span>');
    r.innerHTML = '<div class="col">' +
      '<div class="tools"><a class="btn sm" href="#">← Sổ thơ</a><span class="sp"></span>' +
      '<button class="btn sm" type="button" id="rShare">' + P.ICONS.share.replace('<svg', '<svg width="16" height="16"') + 'Chia sẻ</button>' +
      (owner ? '<a class="btn sm" href="write.html#edit-' + esc(p.id) + '">Sửa</a><button class="btn sm ghost" type="button" id="rDel">Xoá</button>' : '') + '</div>' +
      P.notebook(p, { compact: true }) +
      (p.music ? '<div class="player">' + P.musicPlayer(p.music) + '</div>' : '') +
      '<div class="poem">' + stanzas + '</div>' +
      '<div class="meta"><span>' + esc(P.formName(p.form) || 'Thơ') + '</span><span>' + P.fmtDate(p.createdAt) + '</span>' + (p.updatedAt && p.updatedAt.slice(0, 10) !== String(p.createdAt).slice(0, 10) ? '<span>sửa ' + P.fmtDate(p.updatedAt) + '</span>' : '') + (p._pending ? '<span>chưa đồng bộ, chỉ máy này thấy</span>' : '') + '</div>' +
      '</div>';
    r.hidden = false; r.scrollTop = 0; document.body.style.overflow = 'hidden';
    document.title = p.title + ' · ' + cfg.libraryName;
    $('#rShare').onclick = function () { P.copy(P.siteUrl() + '#poem-' + p.id); };
    var del = $('#rDel'), armed = false;
    if (del) del.onclick = function () {
      if (!armed) { armed = true; del.textContent = 'Bấm lần nữa để xoá'; del.style.color = 'var(--err)'; setTimeout(function () { armed = false; del.textContent = 'Xoá'; del.style.color = ''; }, 4000); return; }
      del.disabled = true; del.textContent = 'Đang xoá…';
      P.deletePoem(p.id).then(function () {
        lib.poems = lib.poems.filter(function (q) { return q.id !== p.id; });
        P.toast(P.token() ? 'Đã xoá «' + p.title + '».' : 'Đã ẩn trên máy này; sẽ xoá hẳn khi kết nối GitHub.');
        location.hash = ''; render();
      }, function (e) { del.disabled = false; del.textContent = 'Xoá'; P.toast('Không xoá được: ' + e.message); });
    };
  }
  window.addEventListener('hashchange', function () { if (!location.hash || location.hash === '#') document.title = cfg.libraryName; route(); });

  var cached = P.ls('poenote.libcache');
  if (cached && cached.poems && owner) { lib = cached; render(); }
  P.loadLibrary().then(function (l) { lib = l; render(); });
})();
</script>
</body>
</html>
